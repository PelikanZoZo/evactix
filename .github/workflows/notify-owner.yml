name: Сообщение владельцу

# Вручную: ставит текст в очередь отправки Дирижёра для владельца (Telegram).
# Текст виден в логах — только рабочие сводки, без секретов и персональных данных.

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Текст сообщения"
        required: true

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Подключение
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          H="$(echo -n "$VPS_HOST" | tr -d '[:space:]')"; P="$(echo -n "$VPS_PORT" | tr -d '[:space:]')"; U="$(echo -n "$VPS_USER" | tr -d '[:space:]')"
          mkdir -p ~/.ssh ~/bin && chmod 700 ~/.ssh
          if [ -n "$SSHPASS" ]; then
            sudo apt-get install -y -qq sshpass >/dev/null
            printf '#!/bin/bash\nexec sshpass -e ssh -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive "$@"\n' > ~/bin/rsh
          else
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519
            printf '#!/bin/bash\nexec ssh "$@"\n' > ~/bin/rsh
          fi
          chmod +x ~/bin/rsh; echo "$HOME/bin" >> "$GITHUB_PATH"
          ssh-keyscan -p "$P" -T 20 "$H" 2>/dev/null > ~/.ssh/known_hosts
          { echo "H=$H"; echo "P=$P"; echo "U=$U"; } >> "$GITHUB_ENV"

      - name: В очередь
        env:
          MSG: ${{ inputs.text }}
        run: |
          case "$MSG" in *'$evxmsg$'*) echo "недопустимый текст"; exit 1;; esac
          printf "insert into jobs.outbox (recipient_id, text) select (value->>'id')::bigint, \$evxmsg\$%s\$evxmsg\$ from jobs.kv where key='owner_recipient' returning id;\n" "$MSG" \
          | rsh -p "$P" "$U@$H" 'sudo -n docker exec -i evactix-db-1 psql -U evactix -d evactix -v ON_ERROR_STOP=1 -P pager=off 2>&1 || docker exec -i evactix-db-1 psql -U evactix -d evactix -v ON_ERROR_STOP=1 -P pager=off'
