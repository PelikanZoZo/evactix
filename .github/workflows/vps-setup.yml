name: Настройка сервера VPS-1

# Запуск вручную: Actions → «Настройка сервера VPS-1» → Run workflow.
# Повторный запуск безопасен: скрипт ничего не ломает, только доводит сервер до нужного состояния.

on:
  workflow_dispatch:

concurrency:
  group: vps-setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      # Если задан VPS_PASSWORD — вход по паролю (временный сервер), иначе по ключу VPS_SSH_KEY
      SSHPASS: ${{ secrets.VPS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Секреты заданы?
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          missing=0
          for n in VPS_HOST VPS_PORT VPS_USER POSTGRES_PASSWORD; do
            if [ -n "${!n}" ]; then echo "OK      $n"; else echo "НЕТ     $n"; missing=1; fi
          done
          if [ -n "$SSHPASS" ]; then echo "Вход: по паролю (VPS_PASSWORD)"
          elif [ -n "$VPS_SSH_KEY" ]; then echo "Вход: по ключу (VPS_SSH_KEY)"
          else echo "НЕТ ни VPS_PASSWORD, ни VPS_SSH_KEY"; missing=1; fi
          [ ${#POSTGRES_PASSWORD} -ge 20 ] || { echo "Пароль базы короче 20 символов"; missing=1; }
          exit $missing

      - name: Подключение по SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          H="$(echo -n "$VPS_HOST" | tr -d '[:space:]')"; P="$(echo -n "$VPS_PORT" | tr -d '[:space:]')"
          mkdir -p ~/.ssh ~/bin && chmod 700 ~/.ssh
          if [ -n "$SSHPASS" ]; then
            sudo apt-get install -y -qq sshpass >/dev/null
            printf '#!/bin/bash\nexec sshpass -e ssh -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive "$@"\n' > ~/bin/rsh
          else
            printf '#!/bin/bash\nexec ssh "$@"\n' > ~/bin/rsh
          fi
          chmod +x ~/bin/rsh; echo "$HOME/bin" >> "$GITHUB_PATH"
          if [ -z "$SSHPASS" ]; then
          # Ключ мог исказиться при копировании из веб-консоли: пересобираем его из «тела» без пробелов и переносов
          printf '%s' "$VPS_SSH_KEY" | python3 -c '
          import sys, re, base64
          t = sys.stdin.read()
          m = re.search(r"-----BEGIN OPENSSH PRIVATE KEY-----(.*?)-----END OPENSSH PRIVATE KEY-----", t, re.S)
          if not m:
              sys.exit("Ключ: нет строк BEGIN/END")
          body = re.sub(r"[^A-Za-z0-9+/=]", "", m.group(1))
          try:
              raw = base64.b64decode(body, validate=True)
          except Exception as e:
              sys.exit("Ключ: тело повреждено (%d символов): %s" % (len(body), e))
          print("Ключ: тело %d символов, заголовок %s" % (len(body), "верный" if raw.startswith(b"openssh-key-v1\0") else "НЕВЕРНЫЙ"), file=sys.stderr)
          lines = [body[i:i+70] for i in range(0, len(body), 70)]
          open(sys.argv[1], "w").write("-----BEGIN OPENSSH PRIVATE KEY-----\n" + "\n".join(lines) + "\n-----END OPENSSH PRIVATE KEY-----\n")
          ' ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "Отпечаток ключа из секрета (сверить с сервером: ssh-keygen -lf /root/.ssh/authorized_keys):"
          ssh-keygen -lf <(ssh-keygen -y -f ~/.ssh/id_ed25519) || { echo "Ключ не читается — скопирован с ошибкой"; exit 1; }
          fi
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$P" -T 20 "$H" 2>/dev/null > ~/.ssh/known_hosts
            echo "Отпечаток сервера (можно сохранить в секрет VPS_KNOWN_HOSTS):"; cat ~/.ssh/known_hosts
          fi
          echo "H=$H" >> "$GITHUB_ENV"; echo "P=$P" >> "$GITHUB_ENV"

      - name: Первичная настройка (bootstrap)
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          U="$(echo -n "$VPS_USER" | tr -d '[:space:]')"; echo "U=$U" >> "$GITHUB_ENV"
          tar czf infra.tgz -C infra .
          rsh -p "$P" -o ConnectTimeout=30 "$U@$H" 'rm -rf /tmp/evactix-infra && mkdir -p /tmp/evactix-infra && tar xzf - -C /tmp/evactix-infra' < infra.tgz
          KP=0; [ -n "$SSHPASS" ] && KP=1
          rsh -p "$P" -o ConnectTimeout=30 -o ServerAliveInterval=15 "$U@$H" \
            "if [ \"\$(id -u)\" = 0 ]; then KEEP_PASSWORD=$KP bash /tmp/evactix-infra/bootstrap.sh; else sudo -n KEEP_PASSWORD=$KP bash /tmp/evactix-infra/bootstrap.sh; fi"

      - name: Сервисы (база и входная точка)
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          S='if [ "$(id -u)" = 0 ]; then bash -s; else sudo -n bash -s; fi'
          rsh -p "$P" "$U@$H" "$S" <<'REMOTE'
          set -e
          install -o deploy -g deploy -m 640 /tmp/evactix-infra/docker-compose.yml /tmp/evactix-infra/Caddyfile /opt/evactix/
          install -o deploy -g deploy -m 750 /tmp/evactix-infra/backup.sh /opt/evactix/
          REMOTE
          # пароль передаём через stdin, в логи он не попадает
          printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD" | rsh -p "$P" "$U@$H" \
            'umask 077; if [ "$(id -u)" = 0 ]; then cat > /opt/evactix/.env && chown deploy:deploy /opt/evactix/.env; else sudo -n tee /opt/evactix/.env >/dev/null && sudo -n chown deploy:deploy /opt/evactix/.env; fi'
          rsh -p "$P" -o ServerAliveInterval=15 "$U@$H" "$S" <<'REMOTE'
          set -e
          cd /opt/evactix
          sudo -u deploy docker compose pull -q db edge
          sudo -u deploy docker compose up -d db edge
          for i in $(seq 1 30); do
            st=$(docker inspect -f '{{.State.Health.Status}}' evactix-db-1 2>/dev/null || echo none)
            [ "$st" = healthy ] && break; sleep 3
          done
          echo "База: $st"
          REMOTE

      - name: Проверка
        run: |
          rsh -p "$P" "$U@$H" 'bash -s' <<'REMOTE'
          cd /opt/evactix
          echo "--- Контейнеры"; sudo -n docker compose ps 2>/dev/null || docker compose ps
          echo "--- PostgreSQL и TimescaleDB"
          (sudo -n docker compose exec -T db psql -U evactix -d evactix -tAc "select version();" 2>/dev/null || docker compose exec -T db psql -U evactix -d evactix -tAc "select version();") | head -1
          (sudo -n docker compose exec -T db psql -U evactix -d evactix -tAc "create extension if not exists timescaledb; select 'timescaledb ' || extversion from pg_extension where extname='timescaledb';" 2>/dev/null || docker compose exec -T db psql -U evactix -d evactix -tAc "create extension if not exists timescaledb; select 'timescaledb ' || extversion from pg_extension where extname='timescaledb';") | tail -1
          echo "--- Входная точка"; curl -s -m 10 http://127.0.0.1/health; echo
          echo "--- Время сервера"; timedatectl | grep -E "Time zone|synchronized"
          echo "--- Память и диск"; free -m | head -3; df -h / | tail -1
          REMOTE
          echo "--- Снаружи:"; curl -s -m 15 "http://$H/health" && echo " (сервер отвечает по IP)"
