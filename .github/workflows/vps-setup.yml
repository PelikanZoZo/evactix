name: Настройка сервера VPS-1

# Запуск вручную: Actions → «Настройка сервера VPS-1» → Run workflow.
# Повторный запуск безопасен: скрипт ничего не ломает, только доводит сервер до нужного состояния.

on:
  workflow_dispatch:

concurrency:
  group: vps-setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Секреты заданы?
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          missing=0
          for n in VPS_HOST VPS_PORT VPS_USER VPS_SSH_KEY POSTGRES_PASSWORD; do
            if [ -n "${!n}" ]; then echo "OK      $n"; else echo "НЕТ     $n"; missing=1; fi
          done
          case "$VPS_SSH_KEY" in *"BEGIN OPENSSH PRIVATE KEY"*) echo "Ключ: формат похож на правильный";; *) echo "Ключ: нет строки BEGIN OPENSSH PRIVATE KEY — скопирован не целиком?"; missing=1;; esac
          [ ${#POSTGRES_PASSWORD} -ge 20 ] || { echo "Пароль базы короче 20 символов"; missing=1; }
          exit $missing

      - name: Подключение по SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          H="$(echo -n "$VPS_HOST" | tr -d '[:space:]')"; P="$(echo -n "$VPS_PORT" | tr -d '[:space:]')"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$P" -T 20 "$H" 2>/dev/null > ~/.ssh/known_hosts
            echo "Отпечаток сервера (можно сохранить в секрет VPS_KNOWN_HOSTS):"; cat ~/.ssh/known_hosts
          fi
          echo "H=$H" >> "$GITHUB_ENV"; echo "P=$P" >> "$GITHUB_ENV"

      - name: Первичная настройка (bootstrap)
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          U="$(echo -n "$VPS_USER" | tr -d '[:space:]')"; echo "U=$U" >> "$GITHUB_ENV"
          tar czf infra.tgz -C infra .
          ssh -p "$P" -o ConnectTimeout=30 "$U@$H" 'rm -rf /tmp/evactix-infra && mkdir -p /tmp/evactix-infra && tar xzf - -C /tmp/evactix-infra' < infra.tgz
          ssh -p "$P" -o ConnectTimeout=30 -o ServerAliveInterval=15 "$U@$H" \
            'if [ "$(id -u)" = 0 ]; then bash /tmp/evactix-infra/bootstrap.sh; else sudo -n bash /tmp/evactix-infra/bootstrap.sh; fi'

      - name: Сервисы (база и входная точка)
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          S='if [ "$(id -u)" = 0 ]; then bash -s; else sudo -n bash -s; fi'
          ssh -p "$P" "$U@$H" "$S" <<'REMOTE'
          set -e
          install -o deploy -g deploy -m 640 /tmp/evactix-infra/docker-compose.yml /tmp/evactix-infra/Caddyfile /opt/evactix/
          install -o deploy -g deploy -m 750 /tmp/evactix-infra/backup.sh /opt/evactix/
          REMOTE
          # пароль передаём через stdin, в логи он не попадает
          printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD" | ssh -p "$P" "$U@$H" \
            'umask 077; if [ "$(id -u)" = 0 ]; then cat > /opt/evactix/.env && chown deploy:deploy /opt/evactix/.env; else sudo -n tee /opt/evactix/.env >/dev/null && sudo -n chown deploy:deploy /opt/evactix/.env; fi'
          ssh -p "$P" -o ServerAliveInterval=15 "$U@$H" "$S" <<'REMOTE'
          set -e
          cd /opt/evactix
          sudo -u deploy docker compose pull -q
          sudo -u deploy docker compose up -d
          for i in $(seq 1 30); do
            st=$(docker inspect -f '{{.State.Health.Status}}' evactix-db-1 2>/dev/null || echo none)
            [ "$st" = healthy ] && break; sleep 3
          done
          echo "База: $st"
          REMOTE

      - name: Проверка
        run: |
          ssh -p "$P" "$U@$H" 'bash -s' <<'REMOTE'
          cd /opt/evactix
          echo "--- Контейнеры"; sudo -n docker compose ps 2>/dev/null || docker compose ps
          echo "--- PostgreSQL и TimescaleDB"
          (sudo -n docker compose exec -T db psql -U evactix -d evactix -tAc "select version();" 2>/dev/null || docker compose exec -T db psql -U evactix -d evactix -tAc "select version();") | head -1
          (sudo -n docker compose exec -T db psql -U evactix -d evactix -tAc "create extension if not exists timescaledb; select 'timescaledb ' || extversion from pg_extension where extname='timescaledb';" 2>/dev/null || docker compose exec -T db psql -U evactix -d evactix -tAc "create extension if not exists timescaledb; select 'timescaledb ' || extversion from pg_extension where extname='timescaledb';") | tail -1
          echo "--- Входная точка"; curl -s -m 10 http://127.0.0.1/health; echo
          echo "--- Время сервера"; timedatectl | grep -E "Time zone|synchronized"
          echo "--- Память и диск"; free -m | head -3; df -h / | tail -1
          REMOTE
          echo "--- Снаружи:"; curl -s -m 15 "http://$H/health" && echo " (сервер отвечает по IP)"
