name: Выкатка Аны

# Ана — отдельный проект рядом с ядром (папка ana/, compose-проект evactix-ana на сервере).
# Запускается сама после слияния изменений в ana/ в main, или вручную: Actions → «Выкатка Аны» → Run workflow.
# Ядро не трогает. Ключ к базе ядра (роль ana, только чтение) берёт на сервере из настроек ядра.

on:
  push:
    branches: [main]
    paths:
      - "ana/**"
      - ".github/workflows/deploy-ana.yml"
  workflow_dispatch:

concurrency:
  group: deploy-ana
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      pg:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: evactix
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evactix" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Тесты Аны (контракт со схемой ядра)
        working-directory: ana
        env:
          TEST_ADMIN_DSN: "host=127.0.0.1 port=5432 user=evactix dbname=postgres"
        run: |
          pip install -q -e ".[test]"
          python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.VPS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Подключение
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          H="$(echo -n "$VPS_HOST" | tr -d '[:space:]')"; P="$(echo -n "$VPS_PORT" | tr -d '[:space:]')"; U="$(echo -n "$VPS_USER" | tr -d '[:space:]')"
          mkdir -p ~/.ssh ~/bin && chmod 700 ~/.ssh
          if [ -n "$SSHPASS" ]; then
            sudo apt-get install -y -qq sshpass >/dev/null
            printf '#!/bin/bash\nexec sshpass -e ssh -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive "$@"\n' > ~/bin/rsh
          else
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519
            printf '#!/bin/bash\nexec ssh "$@"\n' > ~/bin/rsh
          fi
          chmod +x ~/bin/rsh; echo "$HOME/bin" >> "$GITHUB_PATH"
          ssh-keyscan -p "$P" -T 20 "$H" 2>/dev/null > ~/.ssh/known_hosts
          { echo "H=$H"; echo "P=$P"; echo "U=$U"; } >> "$GITHUB_ENV"

      - name: Ждём ядро
        run: |
          # Ане нужны сеть ядра и выданный ядром ключ. Если ядро выкатывается одновременно — ждём до 15 минут.
          rsh -p "$P" "$U@$H" 'bash -s' <<'REMOTE'
          for i in $(seq 1 90); do
            if docker network inspect evactix-core >/dev/null 2>&1 \
               && sudo -n grep -q '^ANA_DB_PASSWORD=' /opt/evactix/.env 2>/dev/null \
               && [ "$(docker inspect -f '{{.State.Running}}' evactix-collector-1 2>/dev/null)" = true ]; then
              echo "Ядро на месте"; exit 0
            fi
            sleep 10
          done
          echo "Ядро не выкачено: сначала нужна «Выкатка ядра»"; exit 1
          REMOTE

      - name: Файлы и настройки
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_BASE: ${{ secrets.TELEGRAM_API_BASE }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          tar czf ana.tgz --exclude='__pycache__' --exclude='*.egg-info' --exclude='.pytest_cache' -C ana .
          rsh -p "$P" "$U@$H" 'rm -rf /tmp/evactix-ana && mkdir -p /tmp/evactix-ana && tar xzf - -C /tmp/evactix-ana' < ana.tgz
          # Секреты идут через stdin; ключ к базе ядра копируется на сервере и в логи не попадает
          REL=$(python3 -c "import tomllib;print(tomllib.load(open('ana/pyproject.toml','rb'))['project']['version'])")
          printf 'TELEGRAM_BOT_TOKEN=%s\nTELEGRAM_CHAT_ID=%s\nTELEGRAM_API_BASE=%s\nDEEPSEEK_API_KEY=%s\nANA_RELEASE=%s\nANA_COMMIT=%s\n' "$TELEGRAM_BOT_TOKEN" "$TELEGRAM_CHAT_ID" "$TELEGRAM_API_BASE" "$DEEPSEEK_API_KEY" "$REL" "$GITHUB_SHA" \
          | rsh -p "$P" "$U@$H" 'if [ "$(id -u)" = 0 ]; then bash /tmp/evactix-ana/install.sh; else sudo -n bash /tmp/evactix-ana/install.sh; fi'

      - name: Сборка и запуск
        run: |
          rsh -p "$P" -o ServerAliveInterval=15 "$U@$H" 'if [ "$(id -u)" = 0 ]; then bash -s; else sudo -n bash -s; fi' <<'REMOTE'
          set -e
          cd /opt/evactix-ana
          D="sudo -u deploy docker compose"
          $D build -q ana
          $D up -d --force-recreate --remove-orphans ana
          sleep 20
          $D ps
          echo "==> Журнал Аны"
          $D logs --tail 20 ana
          echo "==> Telegram с сервера"
          curl -s -o /dev/null -m 10 -w 'api.telegram.org напрямую: %{http_code}\n' https://api.telegram.org/ || echo "api.telegram.org напрямую: нет ответа"
          B=$(grep '^TELEGRAM_API_BASE=' .env | cut -d= -f2-)
          if [ -n "$B" ]; then curl -s -o /dev/null -m 15 -w 'Telegram через переходник: %{http_code} (404 у корня — это норма)\n' "${B%/*}/" || echo "переходник: нет ответа"; else echo "переходник не задан (секрет TELEGRAM_API_BASE)"; fi
          rm -rf /tmp/evactix-ana
          REMOTE
