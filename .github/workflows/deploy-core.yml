name: Выкатка ядра

# Запускается сам после слияния изменений ядра в main, или вручную: Actions → «Выкатка ядра» → Run workflow.
# Собирает образ на сервере, применяет миграции, перезапускает сборщики.
# Пароли ролей collector и ana генерируются на сервере один раз и в логи не попадают.
# Ана — отдельный проект (папка ana/, workflow «Выкатка Аны»).

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "infra/docker-compose.yml"
      - "infra/Caddyfile"
      - "infra/backup.sh"
      - "VERSION"
      - ".github/workflows/deploy-core.yml"
  workflow_dispatch:

concurrency:
  group: deploy-core
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      pg:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: evactix
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evactix" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Тесты ядра
        working-directory: core
        env:
          TEST_ADMIN_DSN: "host=127.0.0.1 port=5432 user=evactix dbname=postgres"
        run: |
          pip install -q -e ".[test]"
          python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.VPS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Подключение
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          H="$(echo -n "$VPS_HOST" | tr -d '[:space:]')"; P="$(echo -n "$VPS_PORT" | tr -d '[:space:]')"; U="$(echo -n "$VPS_USER" | tr -d '[:space:]')"
          mkdir -p ~/.ssh ~/bin && chmod 700 ~/.ssh
          if [ -n "$SSHPASS" ]; then
            sudo apt-get install -y -qq sshpass >/dev/null
            printf '#!/bin/bash\nexec sshpass -e ssh -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive "$@"\n' > ~/bin/rsh
          else
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519
            printf '#!/bin/bash\nexec ssh "$@"\n' > ~/bin/rsh
          fi
          chmod +x ~/bin/rsh; echo "$HOME/bin" >> "$GITHUB_PATH"
          ssh-keyscan -p "$P" -T 20 "$H" 2>/dev/null > ~/.ssh/known_hosts
          { echo "H=$H"; echo "P=$P"; echo "U=$U"; } >> "$GITHUB_ENV"

      - name: Файлы на сервер
        run: |
          tar czf deploy.tgz --exclude=core/tests --exclude='__pycache__' --exclude='*.egg-info' VERSION infra/docker-compose.yml infra/Caddyfile infra/backup.sh core
          rsh -p "$P" "$U@$H" 'rm -rf /tmp/evactix-deploy && mkdir -p /tmp/evactix-deploy && tar xzf - -C /tmp/evactix-deploy' < deploy.tgz
          rsh -p "$P" "$U@$H" 'if [ "$(id -u)" = 0 ]; then bash -s; else sudo -n bash -s; fi' <<'REMOTE'
          set -e
          cd /tmp/evactix-deploy
          install -o deploy -g deploy -m 640 infra/docker-compose.yml infra/Caddyfile /opt/evactix/
          install -o deploy -g deploy -m 750 infra/backup.sh /opt/evactix/
          rm -rf /opt/evactix/core && cp -r core /opt/evactix/core && chown -R deploy:deploy /opt/evactix/core
          REMOTE

      - name: Настройки (.env)
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          # Значения идут через stdin, в командной строке и логах их нет
          printf 'POSTGRES_PASSWORD=%s\nEVACTIX_RELEASE=%s\nEVACTIX_COMMIT=%s\n' "$POSTGRES_PASSWORD" "$(cat VERSION)" "$GITHUB_SHA" \
          | rsh -p "$P" "$U@$H" 'if [ "$(id -u)" = 0 ]; then python3 /tmp/evactix-deploy/core/deploy_env.py /opt/evactix/.env; else sudo -n python3 /tmp/evactix-deploy/core/deploy_env.py /opt/evactix/.env; fi'

      - name: Сборка, миграции, запуск
        run: |
          rsh -p "$P" -o ServerAliveInterval=15 "$U@$H" 'if [ "$(id -u)" = 0 ]; then bash -s; else sudo -n bash -s; fi' <<'REMOTE'
          set -e
          cd /opt/evactix
          D="sudo -u deploy docker compose"
          $D up -d db edge
          for i in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' evactix-db-1)" = healthy ] && break; sleep 3; done
          echo "==> Сборка образа ядра Evactix v$(grep ^EVACTIX_RELEASE= .env | cut -d= -f2)"
          $D build -q collector
          echo "==> Миграции"
          $D run --rm -T migrate </dev/null
          echo "==> Запуск сборщиков"
          $D up -d --remove-orphans collector
          sleep 60
          $D ps
          echo "==> Журнал сборщиков (последние строки)"
          $D logs --tail 30 collector
          rm -rf /tmp/evactix-deploy
          REMOTE

      - name: Что в базе
        run: |
          rsh -p "$P" "$U@$H" 'bash -s' <<'REMOTE' | tee summary.txt
          cd /opt/evactix
          Q() { sudo -n docker compose exec -T db psql -U evactix -d evactix -P pager=off "$@" 2>/dev/null || docker compose exec -T db psql -U evactix -d evactix -P pager=off "$@"; }
          Q -c "select collector, status, written, skipped, rejected, to_char(started_at,'HH24:MI:SS') as started, left(coalesce(error,''),80) as error from collector_runs order by id desc limit 12" </dev/null
          Q -c "select source_id, count(*) as events, min(occurred_at)::date as from_date, max(occurred_at)::date as to_date from events group by 1 order by 1" </dev/null
          Q -c "select count(*) as plans from plans" </dev/null
          Q -At -c "select string_agg(key || ': ' || value, ' · ' order by key) from system_info" </dev/null
          REMOTE
          { echo '### Выкатка ядра'; echo '```'; cat summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
