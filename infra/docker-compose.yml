# Сервисы Evactix на VPS-1. Настроено под небольшой сервер (2 ГБ RAM).
name: evactix

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-core: &core
  image: evactix-core:latest
  build:
    context: ./core
  restart: unless-stopped
  logging: *logging
  depends_on:
    db:
      condition: service_healthy
  environment: &core-env
    DB_HOST: db
    DB_NAME: evactix
    RAW_DIR: /data/raw
    EVACTIX_VERSION: ${EVACTIX_VERSION:-dev}

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: evactix
      POSTGRES_DB: evactix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нужен POSTGRES_PASSWORD}
      TIMESCALEDB_TELEMETRY: "off"
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=40
      - -c
      - timezone=UTC
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - timescaledb.telemetry_level=off
    volumes:
      - dbdata:/var/lib/postgresql/data
    # Порт наружу не публикуется: база видна только внутри сети Docker (принцип № 20)
    mem_limit: 800m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evactix -d evactix"]
      interval: 10s
      timeout: 5s
      retries: 10

  edge:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    mem_limit: 128m

  # Миграции и справочники: запускается при выкатке (docker compose run --rm migrate)
  migrate:
    <<: *core
    restart: "no"
    profiles: ["tools"]
    command: ["python", "-m", "evactix.migrate"]
    environment:
      <<: *core-env
      DB_USER: evactix
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      COLLECTOR_DB_PASSWORD: ${COLLECTOR_DB_PASSWORD:?нужен COLLECTOR_DB_PASSWORD}
      ANA_DB_PASSWORD: ${ANA_DB_PASSWORD:?нужен ANA_DB_PASSWORD}

  # Сборщики: только дописывают события и планы, свои ключи к базе
  collector:
    <<: *core
    command: ["python", "-m", "evactix.runner"]
    environment:
      <<: *core-env
      DB_USER: collector
      DB_PASSWORD: ${COLLECTOR_DB_PASSWORD:?нужен COLLECTOR_DB_PASSWORD}
    volumes:
      - rawdata:/data/raw
    mem_limit: 256m

volumes:
  dbdata:
  caddydata:
  rawdata:

# Сеть ядра с постоянным именем: к ней подключается отдельный проект Аны (evactix-ana)
networks:
  default:
    name: evactix-core
