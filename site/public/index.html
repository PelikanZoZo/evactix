<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evactix</title>
<meta name="description" content="Evactix — система параметрического мониторинга событий">
<meta name="theme-color" content="#0b0b0d">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --bg:#0b0b0d; --fg:#f2f2f3; --or:#ea5a0b; --muted:#6b6b72; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    background:var(--bg); color:var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:44px;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  /* едва заметная сетка-матрица на фоне */
  body::before {
    content:""; position:fixed; inset:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
    background-size:48px 48px; background-position:center;
    -webkit-mask-image:radial-gradient(ellipse at center, #000 0%, transparent 65%);
            mask-image:radial-gradient(ellipse at center, #000 0%, transparent 65%);
    opacity:0; animation:fade 1.6s ease .1s forwards;
  }
  .logo { width:min(560px, 78vw); height:auto; display:block; overflow:visible; }

  .ltr { fill:var(--fg); opacity:0; animation:ltr .7s cubic-bezier(.2,.7,.2,1) var(--t) forwards; }
  @keyframes ltr {
    0%   { opacity:0; fill:var(--or); transform:var(--tx) translateY(260px); }
    35%  { opacity:1; fill:var(--or); }
    100% { opacity:1; fill:var(--fg); }
  }

  .ghost { fill:none; stroke:rgba(255,255,255,.22); stroke-width:10; opacity:0;
           animation:ghost 2.6s ease var(--d) forwards; }
  @keyframes ghost { 0%{opacity:0} 12%{opacity:1} 60%{opacity:1} 100%{opacity:0} }

  .cell { opacity:0; transform-box:fill-box; transform-origin:center;
          animation:cell .45s cubic-bezier(.3,1.6,.5,1) var(--t) forwards; }
  .cell.k { fill:var(--fg); }
  .cell.o { fill:var(--or); filter:url(#glow);
            animation:cell .45s cubic-bezier(.3,1.6,.5,1) var(--t) forwards,
                      signal 6s ease-in-out 3.2s infinite; }
  @keyframes cell { from{opacity:0; transform:scale(.3)} to{opacity:1; transform:scale(1)} }
  /* сигнал: раз в 6 секунд оранжевые клетки «срабатывают» */
  @keyframes signal {
    0%,76%,100% { opacity:1; }
    80% { opacity:.25; }
    84% { opacity:1; }
    88% { opacity:.25; }
    93% { opacity:1; }
  }

  .scan { transform:translateX(-440px); animation:scan 1150ms cubic-bezier(.55,.1,.45,.9) 350ms forwards; }
  @keyframes scan { to { transform:translateX(9912px); opacity:0; } }
  /* короткий проход сканера по матрице — в такт сигналу */
  .scan2 { opacity:0; transform:translateX(7836px);
           animation:scan2 6s cubic-bezier(.5,0,.5,1) 3.2s infinite; }
  @keyframes scan2 {
    0%,62% { opacity:0; transform:translateX(7836px); }
    64%    { opacity:1; }
    78%    { opacity:1; transform:translateX(9732px); }
    80%,100% { opacity:0; transform:translateX(9732px); }
  }

  .enter {
    color:var(--muted); text-decoration:none; font-size:13px; letter-spacing:.32em; text-transform:uppercase;
    padding:8px 4px 8px calc(4px + .32em); border-bottom:1px solid transparent;
    opacity:0; animation:fade .8s ease 2.1s forwards; transition:color .25s, border-color .25s;
  }
  .enter:hover, .enter:focus-visible { color:var(--fg); border-bottom-color:var(--or); outline:none; }
  @keyframes fade { to { opacity:1; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation:none !important; }
    .ltr, .cell, .enter, body::before { opacity:1; }
    .ghost, .scan, .scan2 { display:none; }
  }
</style>
</head>
